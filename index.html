<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunovia - Coming Soon</title>
    <script>
      /**
       * Fix for "Cannot set property fetch of #<Window> which has only a getter"
       * This occurs when a library tries to polyfill fetch by assigning to window.fetch
       * in an environment where window.fetch is read-only.
       */
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function() { console.warn('Blocked attempt to overwrite window.fetch'); },
              configurable: true
            });
          }
        } catch (e) {
          console.error('Failed to shim window.fetch:', e);
        }

        // Also define 'global' as a safe object if it doesn't exist
        if (typeof global === 'undefined') {
          window.global = Object.create(window);
          // Define fetch on global specifically to allow overwriting/polyfilling
          // without hitting the read-only window.fetch
          Object.defineProperty(window.global, 'fetch', {
            value: window.fetch.bind(window),
            writable: true,
            configurable: true
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
